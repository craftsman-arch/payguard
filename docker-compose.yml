name: payguard

services:

  postgres:
    image: postgres:17
    container_name: payguard-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: payguard

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payguard-network


  redis:
    image: redis:8
    container_name: payguard-redis

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf

    ports:
      - "6379:6379"

    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - payguard-network


  kafka:
    image: apache/kafka:4.0.0
    container_name: payguard-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - payguard-network


  keycloak:
   image: quay.io/keycloak/keycloak:26.4.5
   container_name: payguard-keycloak
   environment:
    KC_BOOTSTRAP_ADMIN_USERNAME: admin
    KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    KC_DB: postgres
    KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
    KC_DB_USERNAME: payguard
    KC_DB_PASSWORD: payguard

   ports:
    - "8080:8080"
   volumes:
    - ./docker/keycloak/realms:/opt/keycloak/data/import

   command:
    - start-dev
    - --import-realm
   networks:
    - payguard-network
    
volumes:
  postgres-data:
  kafka-data:


networks:
  payguard-network:
    driver: bridge