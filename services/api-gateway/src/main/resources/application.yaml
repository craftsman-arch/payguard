spring:
  application:
    name: api-gateway

  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true

          httpclient:
            connect-timeout: 5000
            response-timeout: 30s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/payguard

gateway:
  routes:
    user-service:
      uri: ${USER_SERVICE_URL:http://localhost:8081}

    keycloak:
      uri: ${KEYCLOAK_URL:http://localhost:8080}

server:
  port: 8084

  shutdown: graceful

  forward-headers-strategy: framework

  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - application/json
      - application/xml
      - text/plain
      - text/html

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

  endpoint:
    gateway:
      access: read-only

    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include:
            - readinessState
        liveness:
          include:
            - livenessState

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - gateway

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO