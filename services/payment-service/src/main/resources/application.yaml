server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: payment-service

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USERNAME:payguard}
    password: ${PAYMENT_DB_PASSWORD:payguard}
    hikari:
      maximum-pool-size: ${PAYMENT_DB_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${PAYMENT_DB_MINIMUM_IDLE:2}
      connection-timeout: ${PAYMENT_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${PAYMENT_DB_VALIDATION_TIMEOUT_MS:1000}

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/payguard
          audiences:
            - ${PAYMENT_SERVICE_REQUIRED_AUDIENCE:payment-service}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}

  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTEL_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

logging:
  file:
    name: ${LOG_DIR:logs}/${spring.application.name}.log
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    org.springframework.security: INFO
