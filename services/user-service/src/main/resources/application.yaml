server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: payguard
    password: payguard

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/payguard
          audiences:
            - ${PAYGUARD_REQUIRED_AUDIENCE:user-service}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:payguard}
  client-id: ${KEYCLOAK_CLIENT_ID:payguard-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

stripe:
  base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

  refresh-url: ${STRIPE_REFRESH_URL:http://localhost:5173/onboarding/retry}
  return-url: ${STRIPE_RETURN_URL:http://localhost:5173/onboarding/success}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus



logging:
  file:
    name: ${LOG_DIR:logs}/${spring.application.name}.log
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

  level:
    root: INFO
    org.springframework.security: INFO
