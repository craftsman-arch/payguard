server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: payguard
    password: payguard

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  flyway:
    enabled: true

  keycloak:
    server-url: http://localhost:8080
    realm: payguard
    client-id: payguard-api
    client-secret: payguard-secret