server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: payguard
    password: payguard

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8080}/realms/payguard
          audiences:
            - ${PAYGUARD_REQUIRED_AUDIENCE:user-service}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:payguard}
  client-id: ${KEYCLOAK_CLIENT_ID:payguard-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

stripe:
  base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

  refresh-url: ${STRIPE_REFRESH_URL:http://localhost:5173/onboarding/retry}
  return-url: ${STRIPE_RETURN_URL:http://localhost:5173/onboarding/success}

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    topic: ${OUTBOX_MERCHANT_EVENTS_TOPIC:payguard.user-service.merchant-events}
    topic-partitions: ${OUTBOX_MERCHANT_EVENTS_PARTITIONS:6}
    topic-replicas: ${OUTBOX_MERCHANT_EVENTS_REPLICAS:1}
    batch-size: ${OUTBOX_PUBLISHER_BATCH_SIZE:20}
    poll-interval: ${OUTBOX_PUBLISHER_POLL_INTERVAL:1s}
    lease-duration: ${OUTBOX_PUBLISHER_LEASE_DURATION:5m}
    send-timeout: ${OUTBOX_PUBLISHER_SEND_TIMEOUT:10s}
    base-backoff: ${OUTBOX_PUBLISHER_BASE_BACKOFF:5s}
    max-backoff: ${OUTBOX_PUBLISHER_MAX_BACKOFF:15m}
    max-attempts: ${OUTBOX_PUBLISHER_MAX_ATTEMPTS:10}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus



logging:
  file:
    name: ${LOG_DIR:logs}/${spring.application.name}.log
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

  level:
    root: INFO
    org.springframework.security: INFO
